name: SEO Manual Audit

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "Site URL"
        required: true
        default: "https://example.com"
      sitemap_url:
        description: "Sitemap URL"
        required: true
        default: "https://example.com/sitemap.xml"
      max_urls:
        description: "Max URLs, 0 means all"
        required: true
        default: "25"

jobs:
  manual-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run SEO report
        env:
          SITE_URL: ${{ inputs.site_url }}
          SITEMAP_URL: ${{ inputs.sitemap_url }}
          SEO_AUDIT_MAX_URLS: ${{ inputs.max_urls }}
        run: npm run seo:report
      - name: Generate approval pack
        run: npm run seo:pr-pack
      - name: Verify reports
        shell: bash
        run: |
          test -f seo-reports/canonical-audit.json
          test -f seo-reports/canonical-audit.md
          test -f seo-reports/metadata-audit.json
          test -f seo-reports/metadata-audit.md
          test -f seo-reports/link-audit.json
          test -f seo-reports/link-audit.md
          test -f seo-reports/approval-pack.md
      - uses: actions/upload-artifact@v4
        with:
          name: manual-seo-audit
          path: seo-reports/
