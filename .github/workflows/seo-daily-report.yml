name: SEO Daily Report

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  seo-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run SEO report
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          SITEMAP_URL: ${{ vars.SITEMAP_URL }}
          SEO_AUDIT_MAX_URLS: ${{ vars.SEO_AUDIT_MAX_URLS || '0' }}
        run: npm run seo:report
      - name: Verify reports
        shell: bash
        run: |
          test -f seo-reports/canonical-audit.json
          test -f seo-reports/canonical-audit.md
          test -f seo-reports/metadata-audit.json
          test -f seo-reports/metadata-audit.md
          test -f seo-reports/link-audit.json
          test -f seo-reports/link-audit.md
      - uses: actions/upload-artifact@v4
        with:
          name: seo-reports
          path: seo-reports/
